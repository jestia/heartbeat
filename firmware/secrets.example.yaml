# Copy to secrets.yaml and fill in. secrets.yaml stays on your computer; do not commit it.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Hotspot the device opens when it cannot join your Wi-Fi (8+ characters).
fallback_ap_password: "change-me-12345"

# Protects over-the-air firmware updates.
ota_password: "change-me-too"

# Your deployed watchdog URL. "home" is this device's name in alerts; give each device its own.
heartbeat_url: "https://grid-heartbeat.YOUR-SUBDOMAIN.workers.dev/hb/home"

# "Bearer " followed by the same DEVICE_TOKEN you set on the watchdog.
heartbeat_auth: "Bearer YOUR-DEVICE-TOKEN"
